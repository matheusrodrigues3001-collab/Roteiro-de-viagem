<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roteiro da Viagem</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg,#dbeafe,#bfdbfe,#e0f2fe);
    display: flex;
    justify-content: center;
    padding: 25px;
}

.container {
    backdrop-filter: blur(14px);
    background: rgba(255,255,255,0.75);
    width: 100%;
    max-width: 700px;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
}

h1 { text-align: center; color: #1e3a8a; }

.dia {
    margin-top: 18px;
    border-radius: 16px;
    background: white;
    padding: 14px;
    border: 1px solid #dbeafe;
}

.dia h2 { margin: 0 0 10px; font-size: 16px; color: #2563eb; }

.local {
    background: #f0f9ff;
    padding: 8px 10px;
    border-radius: 10px;
    margin: 6px 0;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.acoes button {
    margin-left: 4px;
    border: none;
    border-radius: 6px;
    padding: 2px 6px;
    cursor: pointer;
    font-size: 12px;
    background: #3b82f6;
    color: white;
}

button.voltar {
    width: 100%;
    padding: 10px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<h1>🗺️ Roteiro da Viagem</h1>

<div class="dia"><h2>📍 Dia 1 – Gramado</h2><div class="lista-locais" id="dia1"></div></div>
<div class="dia"><h2>📍 Dia 2 – Gramado</h2><div class="lista-locais" id="dia2"></div></div>
<div class="dia"><h2>📍 Dia 3 – Canela</h2><div class="lista-locais" id="dia3"></div></div>
<div class="dia"><h2>📍 Dia 4 – Canela</h2><div class="lista-locais" id="dia4"></div></div>
<div class="dia"><h2>📍 Dia 5 – Gramado</h2><div class="lista-locais" id="dia5"></div></div>

<button class="voltar" onclick="voltar()">⬅ Voltar ao Início</button>

</div>

<script>
const versaoRoteiro = "v2";

const roteiroPadrao = {
    dia1: [
        "⏰ Acordar",
        "✈️ Aeroporto Galeão → POA",
        "🚌 Ônibus Citral",
        "🏨 Hotel Monte Felice Bosque",
        "🏙️ Av. Borges de Medeiros",
        "🌳 Lago Negro + Pedalinho",
        "🍝 Restaurante Quintanilha",
        "🍰 Royal Trudel",
        "🍕 Pizzaria Cara de Mau",
        "🫕 Fondue Chateu d' Geneve",
        "🏨 Hotel Monte Felice Bosque"
    ],
    dia2: [
        "⏰ Acordar",
        "☕ Café da manhã",
        "❄️ Snowland",
        "💦 Acqua Motion",
        "🍽️ Acqua Motion Almoço",
        "🍫 Casa da Velha Bruxa",
        "🏨 Hotel Monte Felice Bosque",
        "🍕 Pizzaria Cara de Mau",
        "🏨 Hotel Monte Felice Bosque"
    ],
    dia3: [
        "🌄 Pé da Cascata",
        "🍝 Nostri Nonni",
        "🌉 Skyglass",
        "⛪ Catedral de Canela"
    ],
    dia4: [
        "🎢 Alpen Park",
        "🍷 Vinícola Jolimont",
        "🐴 Passeio de Cavalo",
        "🚂 Ferrovia Secreta"
    ],
    dia5: [
        "🛍️ Dia Livre",
        "🍝 Bella Gramado",
        "✈️ POA → Galeão"
    ]
};

let roteiro;

function inicializar(){
    const versaoSalva = localStorage.getItem("versaoRoteiro");

    if(versaoSalva !== versaoRoteiro){
        roteiro = roteiroPadrao;
        salvar();
        localStorage.setItem("versaoRoteiro", versaoRoteiro);
    } else {
        roteiro = JSON.parse(localStorage.getItem("roteiroViagem"));
    }
}

function renderDia(id){
    const container = document.getElementById(id);
    container.innerHTML = "";

    roteiro[id].forEach((local, index) => {
        container.innerHTML += `
            <div class="local">
                <span>${local}</span>
                <div class="acoes">
                    <button onclick="moverCima('${id}', ${index})">⬆️</button>
                    <button onclick="moverBaixo('${id}', ${index})">⬇️</button>
                </div>
            </div>
        `;
    });
}

function moverCima(dia, index){
    if(index === 0) return;
    [roteiro[dia][index-1], roteiro[dia][index]] = [roteiro[dia][index], roteiro[dia][index-1]];
    salvar();
    renderDia(dia);
}

function moverBaixo(dia, index){
    if(index === roteiro[dia].length-1) return;
    [roteiro[dia][index+1], roteiro[dia][index]] = [roteiro[dia][index], roteiro[dia][index+1]];
    salvar();
    renderDia(dia);
}

function salvar(){
    localStorage.setItem("roteiroViagem", JSON.stringify(roteiro));
}

function voltar(){
    window.location.href = "index.html";
}

inicializar();
renderDia("dia1");
renderDia("dia2");
renderDia("dia3");
renderDia("dia4");
renderDia("dia5");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roteiro da Viagem</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg,#dbeafe,#bfdbfe,#e0f2fe);
    display: flex;
    justify-content: center;
    padding: 25px;
}

.container {
    backdrop-filter: blur(14px);
    background: rgba(255,255,255,0.75);
    width: 100%;
    max-width: 700px;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
}

h1 { text-align: center; color: #1e3a8a; }

.dia {
    margin-top: 18px;
    border-radius: 16px;
    background: white;
    padding: 14px;
    border: 1px solid #dbeafe;
}

.dia h2 { margin: 0 0 10px; font-size: 16px; color: #2563eb; }

.local {
    background: #f0f9ff;
    padding: 8px 10px;
    border-radius: 10px;
    margin: 6px 0;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.info {
    display: flex;
    flex-direction: column;
}

.hora {
    font-size: 11px;
    color: #475569;
}

.acoes button {
    margin-left: 4px;
    border: none;
    border-radius: 6px;
    padding: 2px 6px;
    cursor: pointer;
    font-size: 12px;
    background: #3b82f6;
    color: white;
}

button.voltar {
    width: 100%;
    padding: 10px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<h1>🗺️ Roteiro da Viagem</h1>

<div class="dia"><h2>📍 Dia 1</h2><div id="dia1"></div></div>
<div class="dia"><h2>📍 Dia 2</h2><div id="dia2"></div></div>
<div class="dia"><h2>📍 Dia 3</h2><div id="dia3"></div></div>
<div class="dia"><h2>📍 Dia 4</h2><div id="dia4"></div></div>
<div class="dia"><h2>📍 Dia 5</h2><div id="dia5"></div></div>

<button class="voltar" onclick="window.location.href='https://matheusrodrigues3001-collab.github.io/Pagina-Inicial---Viagem/'">
⬅ Voltar ao Início
</button>

</div>

<script>
const versaoRoteiro = "v8";

const roteiroPadrao = {
    dia1: [
        {nome:"⏰ Acordar",hora:""},
        {nome:"✈️ Galeão → POA",hora:""},
        {nome:"🚌 Ônibus Citral",hora:""},
        {nome:"🏨 Hotel Monte Felice Bosque",hora:""},
        {nome:"🏙️ Av. Borges de Medeiros",hora:""},
        {nome:"🌳 Lago Negro",hora:""},
        {nome:"🍝 Restaurante Quintanilha",hora:""},
        {nome:"🍰 Royal Trudel",hora:""},
        {nome:"🏰 Mini Mundo",hora:""},
        {nome:"🫕 Fondue Chateu d' Geneve",hora:""},
        {nome:"🏨 Hotel Monte Felice Bosque",hora:""}
    ],
    dia2: [
        {nome:"⏰ Acordar",hora:""},
        {nome:"☕ Café da manhã",hora:""},
        {nome:"❄️ Snowland",hora:""},
        {nome:"💦 Acqua Motion",hora:""},
        {nome:"🍽️ Almoço Acqua Motion",hora:""},
        {nome:"🏨 Hotel Monte Felice Bosque",hora:""},
        {nome:"🍕 Pizzaria Cara de Mau",hora:""},
        {nome:"🏨 Hotel Monte Felice Bosque",hora:""}
    ],
    dia3: [
        {nome:"⏰ Acordar",hora:""},
        {nome:"☕ Café da manhã",hora:""},
        {nome:"🚌 Brocker Turismo",hora:""},
        {nome:"🍰 Casa da Vó Ivone",hora:""},
        {nome:"🌉 Skyglass",hora:""},
        {nome:"🏨 Hotel Monte Felice Bosque",hora:""}
    ],
    dia4: [
        {nome:"⏰ Acordar",hora:""},
        {nome:"☕ Café da manhã",hora:""},
        {nome:"🍝 Restaurante Vó Eli",hora:""},
        {nome:"⛪ Catedral de Canela",hora:""},
        {nome:"🎢 Alpen Park",hora:""},
        {nome:"🍷 Vinícola Jolimont",hora:""},
        {nome:"🏨 Hotel Monte Felice Bosque",hora:""}
    ],
    dia5: [
        {nome:"⏰ Acordar",hora:""},
        {nome:"☕ Café da manhã",hora:""},
        {nome:"🥪 Schiacciateria Parmino",hora:""},
        {nome:"🚌 Ônibus Citral",hora:""},
        {nome:"🏠 Casa",hora:""}
    ]
};

let roteiro;

function inicializar(){
    if(localStorage.getItem("versaoRoteiro") !== versaoRoteiro){
        roteiro = roteiroPadrao;
        salvar();
        localStorage.setItem("versaoRoteiro", versaoRoteiro);
    } else {
        roteiro = JSON.parse(localStorage.getItem("roteiroViagem"));
    }
}

function renderDia(id){
    const container = document.getElementById(id);
    container.innerHTML = "";

    roteiro[id].forEach((local, index) => {
        container.innerHTML += `
        <div class="local">
            <div class="info">
                <span>${local.nome}</span>
                <span class="hora">🕒 ${local.hora || "Sem horário"}</span>
            </div>
            <div class="acoes">
                <button onclick="editarHora('${id}',${index})">⏰</button>
                <button onclick="moverCima('${id}',${index})">⬆️</button>
                <button onclick="moverBaixo('${id}',${index})">⬇️</button>
            </div>
        </div>`;
    });
}

function editarHora(dia,i){
    const novaHora = prompt("Digite o horário (ex: 14:30):", roteiro[dia][i].hora);
    if(novaHora !== null){
        roteiro[dia][i].hora = novaHora;
        salvar();
        renderDia(dia);
    }
}

function moverCima(dia,i){
    if(i===0) return;
    [roteiro[dia][i-1], roteiro[dia][i]] = [roteiro[dia][i], roteiro[dia][i-1]];
    salvar(); renderDia(dia);
}

function moverBaixo(dia,i){
    if(i===roteiro[dia].length-1) return;
    [roteiro[dia][i+1], roteiro[dia][i]] = [roteiro[dia][i], roteiro[dia][i+1]];
    salvar(); renderDia(dia);
}

function salvar(){
    localStorage.setItem("roteiroViagem", JSON.stringify(roteiro));
}

inicializar();
renderDia("dia1");
renderDia("dia2");
renderDia("dia3");
renderDia("dia4");
renderDia("dia5");
</script>

</body>
</html>
